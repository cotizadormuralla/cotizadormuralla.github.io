<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Fábrica de Murallas</title>
    <style>
        :root {
            --bg-body: #0b0f17;
            --bg-card: #151d2a;
            --border: #232d3f;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --danger: #ef4444;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0; padding: 25px;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 25px;
        }
        .header h1 { font-size: 1.4rem; font-weight: 600; margin: 0; color: var(--text-main); }
        .header p { margin: 4px 0 0 0; font-size: 0.85rem; color: var(--text-muted); }

        .grid-stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px; margin-bottom: 25px;
        }
        .stat-card {
            background-color: var(--bg-card); border: 1px solid var(--border);
            padding: 18px; border-radius: 8px;
        }
        .stat-card .titulo { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .stat-card .valor { font-size: 1.6rem; font-weight: 700; color: var(--text-main); margin-top: 6px; }

        .card-tabla {
            background-color: var(--bg-card); border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden;
        }
        
        .toolbar {
            padding: 15px 20px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .toolbar input {
            background: #0b0f17; border: 1px solid var(--border);
            padding: 8px 12px; border-radius: 6px; color: white; font-size: 0.85rem; width: 250px;
        }
        .toolbar input:focus { outline: none; border-color: var(--accent); }

        table { width: 100%; border-collapse: collapse; font-size: 0.88rem; text-align: left; }
        th { background-color: #0d1420; color: var(--text-muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); color: #e2e8f0; }
        tr:hover { background-color: rgba(255,255,255,0.02); }

        .badge {
            display: inline-block; padding: 3px 8px; border-radius: 4px;
            font-size: 0.75rem; font-weight: 600; background: #1e293b; color: #cbd5e1;
        }
        .badge.porton { background: rgba(56, 189, 248, 0.12); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); }

        .btn-wa {
            color: #34d399; text-decoration: none; font-weight: 600;
        }
        .btn-wa:hover { text-decoration: underline; }

        .btn-borrar {
            background: transparent; border: 1px solid rgba(239, 68, 68, 0.4);
            color: var(--danger); padding: 5px 10px; border-radius: 4px;
            font-size: 0.75rem; cursor: pointer; transition: all 0.2s;
        }
        .btn-borrar:hover { background: var(--danger); color: white; }

        .vacio { padding: 40px; text-align: center; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>Gestión de Cotizaciones | Murallas Prefabricadas</h1>
                <p>Registro automático de consultas e interés de clientes.</p>
            </div>
        </div>

        <div class="grid-stats">
            <div class="stat-card">
                <div class="titulo">Total Consultas</div>
                <div class="valor" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="titulo">Metros Solicitados</div>
                <div class="valor" id="stat-metros">0 m</div>
            </div>
            <div class="stat-card">
                <div class="titulo">Último Cliente</div>
                <div class="valor" id="stat-ultimo" style="font-size: 1.1rem; line-height: 2rem;">-</div>
            </div>
        </div>

        <div class="card-tabla">
            <div class="toolbar">
                <span style="font-weight: 600; font-size: 0.9rem;">Historial de Prospectos</span>
                <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="🔍 Buscar por nombre o teléfono...">
            </div>

            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Cliente / WhatsApp</th>
                            <th>Medidas / Detalle</th>
                            <th>Presupuesto (Obra)</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <tr><td colspan="5" class="vacio">Cargando cotizaciones...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s",
            authDomain: "gestorinmobiliario-d68b3.firebaseapp.com",
            databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com",
            projectId: "gestorinmobiliario-d68b3",
            storageBucket: "gestorinmobiliario-d68b3.firebasestorage.app",
            messagingSenderId: "927434078075",
            appId: "1:927434078075:web:95bd3c4e6720bcd282afde"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const tablaBody = document.getElementById('tabla-body');

        // Escuchar Firebase
        onValue(ref(db, 'clientes_muralla_directos'), (snapshot) => {
            const data = snapshot.val();
            tablaBody.innerHTML = '';

            if (!data) {
                tablaBody.innerHTML = '<tr><td colspan="5" class="vacio">No hay cotizaciones registradas aún.</td></tr>';
                document.getElementById('stat-total').innerText = '0';
                document.getElementById('stat-metros').innerText = '0 m';
                document.getElementById('stat-ultimo').innerText = '-';
                return;
            }

            let totalCotizaciones = 0;
            let totalMetros = 0;
            let ultimoCliente = "-";

            const listaOrdenada = Object.entries(data).reverse();

            listaOrdenada.forEach(([id, item], idx) => {
                totalCotizaciones++;
                let mTotales = item.metros_totales || item.metros_finales || 0;
                totalMetros += parseFloat(mTotales);

                if (idx === 0) ultimoCliente = item.nombre || "Cliente";

                let fechaFormateada = item.fecha ? new Date(item.fecha).toLocaleString('es-PY', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';

                let detallePorton = item.cantidad_portones > 0 ? 
                    `<span class="badge porton">+${item.cantidad_portones} Portón (${item.tipo_apertura || 'Std'})</span>` : 
                    '<span class="badge">Solo muralla</span>';

                let precioCompleto = item.presupuesto_completo ? "Gs. " + item.presupuesto_completo.toLocaleString('es-PY') : '-';

                let fila = document.createElement('tr');
                fila.innerHTML = `
                    <td style="color: var(--text-muted); font-size: 0.8rem;">${fechaFormateada}</td>
                    <td>
                        <strong style="color: white;">${item.nombre || 'Sin nombre'}</strong><br>
                        <a href="https://wa.me/595${item.telefono}" target="_blank" class="btn-wa">💬 ${item.telefono}</a>
                    </td>
                    <td>
                        <b>${mTotales}m</b> total (${item.metros_muralla || mTotales}m muralla)<br>
                        ${detallePorton}
                    </td>
                    <td><strong style="color: #34d399;">${precioCompleto}</strong></td>
                    <td>
                        <button class="btn-borrar" onclick="eliminarCotizacion('${id}')">🗑️ Eliminar</button>
                    </td>
                `;
                tablaBody.appendChild(fila);
            });

            document.getElementById('stat-total').innerText = totalCotizaciones;
            document.getElementById('stat-metros').innerText = totalMetros + " m";
            document.getElementById('stat-ultimo').innerText = ultimoCliente;
        });

        // Función global para eliminar registros
        window.eliminarCotizacion = function(id) {
            if (confirm("¿Estás seguro de que deseas borrar esta cotización de la base de datos?")) {
                remove(ref(db, 'clientes_muralla_directos/' + id)).then(() => {
                    console.log("Registro eliminado correctamente.");
                }).catch(err => {
                    alert("Error al eliminar el registro.");
                });
            }
        };

        // Filtro de búsqueda
        window.filtrarTabla = function() {
            let input = document.getElementById("buscador").value.toLowerCase();
            let filas = tablaBody.getElementsByTagName("tr");

            for (let i = 0; i < filas.length; i++) {
                let texto = filas[i].innerText.toLowerCase();
                filas[i].style.display = texto.includes(input) ? "" : "none";
            }
        };
    </script>
</body>
</html>
