<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Asesor | TuringCotizador</title>
    <style>
        :root { --bg-body: #020617; --bg-card: #0f172a; --border: #1e293b; --text-main: #f8fafc; --primary: #0ea5e9; }
        body { font-family: sans-serif; background-color: var(--bg-body); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px;}
        .card { background: var(--bg-card); border: 1px solid var(--border); padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; }
        .btn { background: var(--primary); color: #000; padding: 12px; border:none; width:100%; border-radius:6px; font-weight:bold; cursor:pointer;}
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; background: #020617; border: 1px solid var(--border); color: white; border-radius: 6px; box-sizing: border-box;}
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top:0; color:var(--primary);">Registro Rápido Asesor</h2>
        <span id="user-email" style="display:block; margin-bottom:20px; font-size:0.8rem; color:grey;">Cargando...</span>
        
        <input type="text" id="cliente" placeholder="Nombre del Cliente" required>
        <input type="text" id="ciudad" placeholder="Ciudad (Ej: San Lorenzo)" required>
        <select id="tipo">
            <option value="Llave en mano">1. Obra Terminada (Llave en mano)</option>
            <option value="Solo Materiales (Envío a Obra)">2. Solo Materiales (Envío a Obra)</option>
            <option value="Solo Materiales (Retiro de Fábrica)">3. Solo Materiales (Retiro de Fábrica)</option>
        </select>
        <div style="display:flex; gap:10px;">
            <input type="number" id="metros" placeholder="Metros" required>
            <input type="number" id="portones" placeholder="Portones (0, 1, 2)" value="0">
        </div>
        
        <button class="btn" onclick="guardar()">Enviar a Fábrica</button>
        <button onclick="cerrarSesion()" style="background:transparent; border:none; color:grey; width:100%; margin-top:20px; cursor:pointer;">Cerrar Sesión</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
        import { getDatabase, ref, get, push, set } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

        const db = getDatabase(initializeApp({ apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s", databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com", projectId: "gestorinmobiliario-d68b3" }));
        const auth = getAuth();
        let jefeUID = ""; let asName = "";

        onAuthStateChanged(auth, (u) => {
            if (u) {
                document.getElementById('user-email').innerText = "Vendedor: " + u.email;
                get(ref(db, 'empresas')).then(s => {
                    s.forEach(emp => { let vends = emp.child('vendedores').val(); if(vends) Object.values(vends).forEach(v => { if(v.email === u.email) { jefeUID = emp.key; asName = v.nombre; } }); });
                });
            } else { window.location.href = "login.html"; }
        });

        window.guardar = function() {
            if(!jefeUID) return alert("Cuenta no vinculada.");
            set(push(ref(db, `empresas/${jefeUID}/cotizaciones`)), {
                vendedor: asName, cliente: document.getElementById('cliente').value, ciudad: document.getElementById('ciudad').value,
                tipoVenta: document.getElementById('tipo').value, metros: document.getElementById('metros').value, portones: document.getElementById('portones').value,
                estado: "Cotizado Asesor", fecha: new Date().toISOString()
            }).then(() => { alert("Venta registrada."); document.getElementById('metros').value = ""; document.getElementById('cliente').value = ""; });
        }
        window.cerrarSesion = function() { localStorage.removeItem("turing_ultimo_panel"); signOut(auth).then(() => window.location.href="login.html"); }
    </script>
</body>
</html>
